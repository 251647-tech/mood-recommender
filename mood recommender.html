  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Segoe UI, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      width: 95%;
      max-width: 1200px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 0 25px rgba(0,0,0,0.4);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    h1 {
      grid-column: span 2;
      text-align: center;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .camera-box {
      background: rgba(0,0,0,0.4);
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      position: relative;
    }

    video, canvas {
      width: 100%;
      border-radius: 12px;
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      left: 0;
      top: 0;
    }

    .emotion-badge {
      margin-top: 10px;
      display: inline-block;
      padding: 8px 16px;
      border-radius: 20px;
      background: linear-gradient(45deg, #00c6ff, #0072ff);
      font-weight: bold;
    }

    .rec-box {
      display: grid;
      grid-template-rows: repeat(3, 1fr);
      gap: 15px;
    }

    .card {
      background: rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 15px;
    }

    .items {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .item {
      width: 90px;
      text-align: center;
      font-size: 12px;
      cursor: pointer;
    }

    .item img {
      width: 100%;
      border-radius: 10px;
    }

    footer {
      grid-column: span 2;
      text-align: center;
      margin-top: 8px;
      opacity: 0.7;
      font-size: 13px;
    }

    @media(max-width: 768px) {
      .app-container {
        grid-template-columns: 1fr;
      }
      h1, footer {
        grid-column: span 1;
      }
    }
    #toggleBtn {
  margin-top: 12px;
  padding: 12px 24px;
  border: none;
  border-radius: 8px;
  background: #4CAF50;
  color: white;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

#toggleBtn.stop {
  background: #f44336;
}

  </style>
</head>

// ================== UI FUNCTIONS ==================
function renderItems(id, items) {
  const box = document.getElementById(id);
  box.innerHTML = "";

  items.forEach(item => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `<img src="${item.img}"><div>${item.name}</div>`;
    if (item.link) div.onclick = () => window.open(item.link, "_blank");
    box.appendChild(div);
  });
}

function showRecommendations(emotion) {
  document.getElementById("emotion").innerText = emotion.toUpperCase();
  const rec = data[emotion] || data["happy"];

  renderItems("music", rec.music);
  renderItems("books", rec.books);
  renderItems("movies", rec.movies);
}

// ================== CAMERA ==================
async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
}

// ================== MODELS ==================
async function loadModels() {
  const URL = "https://raw.githubusercontent.com/justadudewhohacks/face-api.js/master/weights";
  await faceapi.nets.tinyFaceDetector.loadFromUri(URL);
  await faceapi.nets.faceExpressionNet.loadFromUri(URL);
}

// ================== DETECTION CONTROL ==================
toggleBtn.addEventListener("click", () => {
  detecting = !detecting;

  if (detecting) {
    toggleBtn.innerText = "⏹ Stop Detection";
    toggleBtn.classList.add("stop");
    startDetection();
  } else {
    toggleBtn.innerText = "⏵ Start Detection";
    toggleBtn.classList.remove("stop");
    stopDetection();
  }
});

function startDetection() {
  const size = {
    width: video.videoWidth,
    height: video.videoHeight
  };

  canvas.width = size.width;
  canvas.height = size.height;
  faceapi.matchDimensions(canvas, size);

  detectInterval = setInterval(async () => {
    const detections = await faceapi
      .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
      .withFaceExpressions();

    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (!detections) return;

    const resized = faceapi.resizeResults(detections, size);
    faceapi.draw.drawDetections(canvas, resized);

    let best = { name: "happy", prob: 0 };
    for (let e in detections.expressions) {
      if (detections.expressions[e] > best.prob) {
        best = { name: e, prob: detections.expressions[e] };
      }
    }

    showRecommendations(best.name);
  }, 600);
}

function stopDetection() {
  clearInterval(detectInterval);
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  document.getElementById("emotion").innerText = "STOPPED";
  document.getElementById("music").innerHTML = "";
  document.getElementById("books").innerHTML = "";
  document.getElementById("movies").innerHTML = "";
}

// ================== START APP ==================
async function startApp() {
  await loadModels();
  await startCamera();
}

startApp();
</script>
